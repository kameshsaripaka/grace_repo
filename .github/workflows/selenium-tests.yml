name: Selenium Test Automation

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v6

      # Step 2: Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3: Display Java version
      - name: Verify Java
        run: java -version

      # Step 4: Display Maven version
      - name: Verify Maven
        run: mvn -version

      # Step 5: Run Selenium tests
      - name: Run TestNG Selenium Tests
        run: mvn clean test

